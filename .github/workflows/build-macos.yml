name: Build macOS DMG

# 触发方式:
#   1. Actions 页面手动点击 "Run workflow"
#   2. push 到 main/master 自动构建
#   3. push 一个 tag (如 v3.1.3-mac) 时, DMG 会自动挂到 GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['*']

permissions:
  contents: write   # 供 tag 触发时上传 Release

jobs:
  build-dmg:
    name: DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4), 公共仓库免费
          - os: macos-15
            arch: arm64
          # Intel x86_64, 官方提供至 2027-08, 公共仓库免费
          - os: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build DMG
        run: bash scripts/build_mac_dmg.sh ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-macos-${{ matrix.arch }}
          path: chaoxing-macos-*.dmg
          if-no-files-found: error

      - name: Attach DMG to Release (push tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chaoxing-macos-*.dmg
